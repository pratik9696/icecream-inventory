name = "icecream-inventory"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# Non-secret config. LEGACY_SCRIPT_URL is the existing Apps Script web app URL
# (same one currently in index.html's SCRIPT_URL) - writes get mirrored there
# so the Google Sheet + its native Dashboard tab keep working.
[vars]
LEGACY_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgs9xmtHpxbb11V8_vit02XEbzTYLtBx_KPAL8mpkjFAtk5ox2zU16vwAKYbAGx7hAuQ/exec"

# Created via: wrangler d1 create icecream-db
# Paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "icecream-db"
database_id = "6ead33ae-70bb-4f42-8d88-a02dddc74028"
